# Weekly ACR cleanup
#
# Unlike the other workflows in this repo, this one is NOT reusable — it has
# its own schedule trigger and runs here.
#
# baipacr is Standard SKU (100 GiB included) and has been running over quota.
# ACR's built-in untagged-manifest retention policy is Premium-only, so cleanup
# is driven externally with `acr purge` running as an on-demand ACR Task.
#
# Safety: the script locks every image that is actually deployed
# (delete-enabled=false) before purging, and never passes --include-locked.
# Age alone is not a safe signal here — several live deployments pin tags that
# are months old. See scripts/acr_cleanup.py for the full rationale.
#
# Scheduled runs use the repository default branch (main), which the Azure
# federated credential trusts (claims['sub'] matches
# 'repo:BaiP-AI-Private/*:ref:refs/heads/main').
#
# PREREQUISITE — AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID must
# be set on THIS repo.
#
# They are per-repo values, not org-level. The other workflows here
# (build-push.yml, update-gitops.yml) are `workflow_call` reusables that run in
# the *caller's* context via `secrets: inherit`, so baip-workflows never needed
# its own copy. This workflow has its own trigger and runs natively here, so it
# does. Without them azure/login fails with:
#
#   Login failed ... Ensure 'client-id' and 'tenant-id' are supplied.
#
# The same applies to any future self-triggering workflow added to this repo.

name: ACR cleanup

on:
  schedule:
    # Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only — lock/unlock/delete nothing"
        type: boolean
        default: true
      registry:
        description: "ACR name"
        type: string
        default: baipacr

permissions:
  id-token: write # OIDC token for Azure login
  contents: read

concurrency:
  group: acr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (cleanup script)
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Same Key Vault deploy-key mechanism update-gitops.yml already uses, so
      # there is only one way to reach baip-argocd-helm.
      - name: Fetch GitOps deploy key from Key Vault
        run: |
          mkdir -p ~/.ssh
          az keyvault secret show \
            --vault-name "${AZURE_KEYVAULT_NAME}" \
            --name "${AZURE_KEYVAULT_SECRET_NAME}" \
            --query value -o tsv > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        env:
          AZURE_KEYVAULT_NAME: baip-kv
          AZURE_KEYVAULT_SECRET_NAME: baip-argocd-helm-deploy-key

      # rke2-baip is the LIVE branch and a literal name, not "whatever the
      # default branch is". main still carries the dead aks-baip tree.
      - name: Checkout GitOps values (rke2-baip branch)
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch rke2-baip \
            git@github.com:BaiP-AI-Private/baip-argocd-helm.git argocd-helm
          test -d argocd-helm/rke2-baip/prod || {
            echo "::error::rke2-baip/prod not found — wrong branch or repo layout changed"
            exit 1
          }

      # The cluster API is not assumed reachable from a GitHub runner. The
      # script treats kubectl as best-effort and falls back to values files.
      - name: Run cleanup
        run: |
          python scripts/acr_cleanup.py \
            --registry "${REGISTRY}" \
            --values-dir argocd-helm/rke2-baip \
            --skip-cluster \
            ${DRY_RUN:+--dry-run} | tee cleanup.log
        env:
          REGISTRY: ${{ inputs.registry || 'baipacr' }}
          # Scheduled runs are real; manual runs default to dry-run.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### ACR cleanup"
            echo '```'
            tail -40 cleanup.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acr-cleanup-log
          path: cleanup.log
          if-no-files-found: ignore
